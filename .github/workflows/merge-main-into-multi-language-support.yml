name: Merge main into multi-language-support

on:
  schedule:
    - cron: '0 15 * * 1'  # Weekly on Mondays at 3pm UTC / 8am PDT
  workflow_dispatch:       # Allow manual triggering

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multi-language-support
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/valkey-io/valkey-search.git
          git fetch upstream main

      - name: Merge main into feature branch
        id: merge
        run: |
          if ! git merge upstream/main --no-edit -m "Merge upstream/main into multi-language-support"; then
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push updated branch
        if: steps.merge.outputs.conflict != 'true'
        run: git push origin multi-language-support

      - name: Open issue on conflict
        if: steps.merge.outputs.conflict == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'merge-conflict'
            });
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Merge conflict: main into multi-language-support',
                body: 'Automated merge of upstream `main` into `multi-language-support` failed due to conflicts.\n\nManual resolution needed:\n```bash\ngit fetch upstream main\ngit merge upstream/main\n# resolve conflicts\ngit push origin multi-language-support\n```',
                labels: ['merge-conflict']
              });
            }
