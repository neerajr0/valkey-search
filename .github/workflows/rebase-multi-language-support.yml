name: Rebase multi-language-support onto main

on:
  schedule:
    - cron: '0 15 * * *'  # Daily at 3pm UTC / 8am PDT 
  workflow_dispatch:       # Allow manual triggering

jobs:
  rebase:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multi-language-support
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/valkey-io/valkey-search.git
          git fetch upstream main

      - name: Rebase onto main
        id: rebase
        run: |
          if ! git rebase upstream/main; then
            git rebase --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push rebased branch
        if: steps.rebase.outputs.conflict != 'true'
        run: git push --force-with-lease origin multi-language-support

      - name: Open issue on conflict
        if: steps.rebase.outputs.conflict == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'rebase-conflict'
            });
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Rebase conflict: multi-language-support onto main',
                body: 'Automated rebase of `multi-language-support` onto upstream `main` failed due to conflicts.\n\nManual resolution needed:\n```bash\ngit fetch upstream main\ngit rebase upstream/main\n# resolve conflicts\ngit push --force-with-lease origin multi-language-support\n```',
                labels: ['rebase-conflict']
              });
            }
